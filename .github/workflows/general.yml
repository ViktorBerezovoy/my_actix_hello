name: CI Pipeline

on:
  push:
    branches:
      - main # Замени на нужную ветку
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  # Глобально отключаем БД для статических проверок (fmt, clippy)
  SQLX_OFFLINE: true 

jobs:
  check-and-test:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Set up Rust cache
        # Кэширует зависимости, сильно ускоряет повторные сборки
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        # Скачивает скомпилированный бинарник за пару секунд
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9 # Версия соответствует зависимости в Cargo.toml

      # Простые проверки выполняются до поднятия базы
      - name: Enforce formatting
        run: cargo fmt --check

      - name: Linting
        run: cargo clippy -- -D warnings

      # Поднятие базы ровно один раз через твой рабочий скрипт
      - name: Migrate database via Podman
        run: ./scripts/init_db.sh

      - name: Check that queries are fresh
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Run Valkey via Podman
        run: ./scripts/init_valkey.sh

      - name: Run tests
        env:
          # Локально включаем коннект к поднятой БД для интеграционных тестов
          SQLX_OFFLINE: false
        run: cargo test
