[package]
name = "actix_hello"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "actix_hello"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
config = { version = "0.15", default-features = false, features = ["yaml"] }
secrecy = { version = "0.10", features = ["serde"] }
unicode-segmentation = "1"
validator = { version = "0.21", features = ["derive"] }
url = { version = "2", features = ["serde"] }
rand = "0.10"
base64 = "0.23"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.1"
tracing-actix-web = "0.7"
hex = "0.4"
argon2 = { version = "0.5", features = ["std"] }
dotenvy = "0.15"
html-escape = "0.2"
hmac = "0.13"
sha2 = "0.11"
actix-web-flash-messages = { version = "0.5", features = ["cookies"] }
actix-session = { version = "0.11", features = ["redis-session", "redis-session-rustls"] }

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["json", "form", "cookies"]

[dependencies.sqlx]
version = "0.9"
default-features = false
features = [
    "runtime-tokio",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]
[dependencies.uuid]
version = "1.24"
features = [
    "v4",
    "serde"
]

[dev-dependencies]
fake = "5.1"
quickcheck = "1"
quickcheck_macros = "1"
wiremock = "0.6"
linkify = "0.11"
serde_json = "1"
