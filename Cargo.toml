[package]
name = "actix_hello"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "actix_hello"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
config = { version = "0.15", default-features = false, features = ["yaml"] }
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.1"

[dependencies.sqlx]
version = "0.9"
default-features = false
features = [
    "runtime-tokio",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]
[dependencies.uuid]
version = "1.24"
features = [
    "v4",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = "0.12"
